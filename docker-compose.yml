
services:
  postgres:
    image: postgres:16
    container_name: tripmate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tripmate_user
      POSTGRES_PASSWORD: 0000
      POSTGRES_DB: tripmate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
